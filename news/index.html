<main class="stagewrap" id="stagewrap">
  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen">

        <div class="statusbar" id="statusbar">
          <span>12:30</span>
          <span class="camera"></span>
          <span class="icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5 0 3.2A11.5 11.5 0 0 1 16 3.2Z"/></svg>
            <svg width="14" height="12" viewBox="0 0 14 12" fill="currentColor"><path d="M14 0v12H0Z"/></svg>
            <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x=".5" y=".5" width="19" height="11" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="currentColor"/><rect x="20.5" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>

        <!-- App screens (Figma: Newsfeed - Design, "News Feed" and "Menu") -->
        <div class="app" id="app">
          <section class="scr feed" aria-label="Top Stories">
            <header class="appbar">
              <button class="icon-btn" id="openMenu" aria-label="Open menu"><img src="assets/icon-menu.svg" alt="" width="24" height="24"></button>
              <h1 class="feed-title">Top Stories</h1>
            </header>

            <div class="feed-list" id="feedList"></div>

            <div class="swipe-hint">
              <img src="assets/icon-swipe-up.svg" alt="" width="19" height="19">
              <span>Swipe up</span>
              <img src="assets/icon-swipe-up.svg" alt="" width="19" height="19">
            </div>
          </section>

          <section class="scr menu" id="menuScr" aria-label="Menu">
            <header class="menu-head">
              <button class="icon-btn" id="closeMenu" aria-label="Back to feed"><img src="assets/icon-back.svg" alt="" width="24" height="24"></button>
              <h1 class="menu-title">Menu</h1>
            </header>
            <nav class="topics" id="topics"></nav>
            <div class="menu-fill"></div>
          </section>

          <!-- Android navigation bar -->
          <div class="navbar" aria-hidden="true">
            <span class="nb-recents"><i></i><i></i><i></i></span>
            <img class="nb-home" src="assets/nav-home.svg" alt="" width="16" height="16">
            <img class="nb-back" src="assets/nav-back.svg" alt="" width="9.06058" height="16.0075">
          </div>
        </div>

        <!-- First-run coachmarks -->
        <div class="coach" id="coach" aria-live="polite" hidden>
          <div class="hole" id="hole"></div>
          <div class="ring" id="ring"></div>
          <div class="cm-text" id="cmText"></div>
          <div class="cm-card" id="cmCard">
            <div class="cm-card-title" id="cmCardTitle"></div>
            <div class="cm-card-sub" id="cmCardSub"></div>
          </div>
          <div class="tap-pos" id="tapPos">
            <div class="tap-trail"></div>
            <div class="tap-dot" id="tapDot"></div>
          </div>
          <div class="win-tick" id="winTick">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.2 12.6l3.8 3.8 7.8-8"/></svg>
          </div>
          <div class="cm-done" id="cmDone">
            <div class="cm-done-title">You’re all set!</div>
            <button class="cm-got" id="cmGot">Explore Now</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<button class="replay" id="replay">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  Replay coachmarks
</button>

<script src="news-data.js"></script>
<script src="news.js"></script>
<script src="../proto-nav.js"></script>
</body>
</html>
